<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive WRF domain planning and namelist.wps generator.">
  <title>WRF Domain Wizard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container-fluid py-3 px-lg-4">
    <header class="mb-3">
      <h1 class="text-center mb-1">WRF Domain Wizard</h1>
      <p class="text-center text-muted mb-0">Plan nested WRF domains and export a WPS namelist.</p>
    </header>

    <div class="row g-3">
      <section class="col-lg-8">
        <div id="map" aria-label="Interactive map for WRF domain planning"></div>
      </section>

      <aside class="col-lg-4">
        <div class="controls p-3 border rounded bg-light">
          <h4>Domain Settings</h4>

          <div class="mb-3">
            <label for="domainCount" class="form-label">Number of Domains</label>
            <select id="domainCount" class="form-select">
              <option value="1">1 — Single domain</option>
              <option value="2">2 — One nested domain</option>
              <option value="3">3 — Two nested domains</option>
            </select>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-6">
              <label for="dxInput" class="form-label">dx (m)</label>
              <input id="dxInput" class="form-control" type="number" min="100" step="100" value="10000">
            </div>
            <div class="col-6">
              <label for="dyInput" class="form-label">dy (m)</label>
              <input id="dyInput" class="form-control" type="number" min="100" step="100" value="10000">
            </div>
          </div>

          <div class="alert alert-info py-2 small">
            <strong>Workflow:</strong> zoom to your study region, then click <em>Draw Domains</em>.
            Nested domains use a centered 3:1 grid ratio. You can edit the rectangles with the map toolbar.
          </div>

          <button id="drawBtn" class="btn btn-primary w-100 mb-2">Draw Domains</button>
          <button id="exportBtn" class="btn btn-success w-100">Export namelist.wps</button>

          <div id="output" class="mt-3" aria-live="polite">
            <p class="text-muted mb-0">Draw domains to see their boundaries.</p>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <script src="namelist-template.js"></script>
  <script src="script.js"></script>
</body>
</html>
